name: Test registries input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-bun
        uses: .
        with:
          bun-version: latest
          registries: |
            https://registry.npmjs.org/
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
          BUN_PATH: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          echo "bun-version: $BUN_VERSION"
          echo "bun-path: $BUN_PATH"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output should not be empty"
            exit 1
          fi
          echo "PASS: bun-version is set"
      - name: Assert bun is executable
        run: |
          which bun
          bun --version
          echo "PASS: bun is on PATH and executable"
