name: Test registries input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bun-version: latest
          registries: |
            https://registry.npmjs.org/
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.action.outputs.bun-version }}
        run: |
          echo "bun-version: $BUN_VERSION"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS: bun-version is set to $BUN_VERSION"
      - name: Assert bun is executable
        run: |
          if ! command -v bun > /dev/null 2>&1; then
            echo "FAIL: bun is not on PATH"
            exit 1
          fi
          echo "PASS: bun is available at $(command -v bun)"
          bun --version
