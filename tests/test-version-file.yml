name: Test version file installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .bun-version file
        run: |
          echo "1.1.3" > "$GITHUB_WORKSPACE/.bun-version"
          cat "$GITHUB_WORKSPACE/.bun-version"
      - id: setup-bun
        uses: .
        with:
          bun-version-file: ".bun-version"
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
        run: |
          echo "bun-version: $BUN_VERSION"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS: bun-version=$BUN_VERSION"
      - name: Assert bun binary reports correct version
        run: |
          INSTALLED=$(bun --version)
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "1.1.3" ]; then
            echo "FAIL: expected bun 1.1.3, got $INSTALLED"
            exit 1
          fi
          echo "PASS: bun version matches .bun-version file"
