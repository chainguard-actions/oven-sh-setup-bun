name: Test registry-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bun-version: latest
          registry-url: https://registry.npmjs.org/
      - name: Assert bun-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.bun-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert bun is on PATH
        run: |
          if ! command -v bun &>/dev/null; then
            echo "FAIL: bun not found on PATH"
            exit 1
          fi
          echo "PASS: $(bun --version)"
