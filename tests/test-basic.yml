name: Test basic usage - install latest Bun
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-bun
        uses: .
        with:
          bun-version: latest

      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
        run: |
          echo "bun-version: $BUN_VERSION"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS: bun-version=$BUN_VERSION"

      - name: Assert bun-path output is set
        env:
          BUN_PATH: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          echo "bun-path: $BUN_PATH"
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun-path output is empty"
            exit 1
          fi
          echo "PASS: bun-path=$BUN_PATH"

      - name: Assert bun-download-url output is set
        env:
          BUN_DOWNLOAD_URL: ${{ steps.setup-bun.outputs.bun-download-url }}
        run: |
          echo "bun-download-url: $BUN_DOWNLOAD_URL"
          if [ -z "$BUN_DOWNLOAD_URL" ]; then
            echo "FAIL: bun-download-url output is empty"
            exit 1
          fi
          echo "PASS: bun-download-url=$BUN_DOWNLOAD_URL"

      - name: Assert bun is available in PATH
        run: |
          which bun
          if ! command -v bun &>/dev/null; then
            echo "FAIL: bun not found in PATH"
            exit 1
          fi
          echo "PASS: bun is in PATH"

      - name: Assert bun runs correctly
        run: |
          BUN_OUT=$(bun --version)
          echo "bun --version: $BUN_OUT"
          if [ -z "$BUN_OUT" ]; then
            echo "FAIL: bun --version returned empty output"
            exit 1
          fi
          echo "PASS"
