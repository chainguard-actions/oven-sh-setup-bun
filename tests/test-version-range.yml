name: Test version range/wildcard installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-bun
        uses: .
        with:
          bun-version: "1.1.x"
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
        run: |
          echo "bun-version: $BUN_VERSION"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS: bun-version=$BUN_VERSION"
      - name: Assert bun binary is on PATH and version starts with 1.1
        run: |
          INSTALLED=$(bun --version)
          echo "installed bun version: $INSTALLED"
          if [[ "$INSTALLED" != "1.1."* ]]; then
            echo "FAIL: expected bun version in 1.1.x range, got $INSTALLED"
            exit 1
          fi
          echo "PASS: bun version is in 1.1.x range"
      - name: Assert bun-path output points to a real file
        env:
          BUN_PATH: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          echo "bun-path: $BUN_PATH"
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun-path output is empty"
            exit 1
          fi
          if [ ! -f "$BUN_PATH" ]; then
            echo "FAIL: bun-path does not point to an existing file: $BUN_PATH"
            exit 1
          fi
          echo "PASS: bun-path=$BUN_PATH exists"
