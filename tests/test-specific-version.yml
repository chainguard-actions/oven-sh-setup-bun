name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-bun
        uses: .
        with:
          bun-version: "1.1.0"
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
        run: |
          echo "bun-version: $BUN_VERSION"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS: bun-version is '$BUN_VERSION'"
      - name: Assert bun is on PATH and reports correct version
        run: |
          INSTALLED=$(bun --version)
          echo "installed bun version: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: bun --version returned empty"
            exit 1
          fi
          # Verify the version starts with 1.1
          if echo "$INSTALLED" | grep -qE '^1\.1\.'; then
            echo "PASS: bun version matches expected 1.1.x"
          else
            echo "FAIL: expected version 1.1.x but got '$INSTALLED'"
            exit 1
          fi
