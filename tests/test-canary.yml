name: Test canary channel installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-bun
        uses: .
        with:
          bun-version: canary
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
        run: |
          echo "bun-version: $BUN_VERSION"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS: bun-version=$BUN_VERSION"
      - name: Assert bun-path output is set
        env:
          BUN_PATH: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          echo "bun-path: $BUN_PATH"
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun-path output is empty"
            exit 1
          fi
          echo "PASS: bun-path=$BUN_PATH"
      - name: Assert bun is on PATH and executable
        run: |
          which bun
          bun --version
          echo "PASS: bun canary is on PATH and executable"
      - name: Assert bun-download-url contains canary
        env:
          DOWNLOAD_URL: ${{ steps.setup-bun.outputs.bun-download-url }}
        run: |
          echo "bun-download-url: $DOWNLOAD_URL"
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "FAIL: bun-download-url output is empty"
            exit 1
          fi
          if ! echo "$DOWNLOAD_URL" | grep -qi "canary"; then
            echo "FAIL: expected download URL to contain 'canary', got: $DOWNLOAD_URL"
            exit 1
          fi
          echo "PASS: download URL contains 'canary'"
