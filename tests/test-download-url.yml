name: Test custom download URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-bun
        uses: .
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.1.0/bun-linux-x64.zip"

      - name: Assert bun is installed via custom URL
        run: |
          if ! command -v bun &>/dev/null; then
            echo "FAIL: bun not found in PATH"
            exit 1
          fi
          INSTALLED=$(bun --version)
          echo "bun --version: $INSTALLED"
          echo "PASS: bun is available at version $INSTALLED"

      - name: Assert bun-download-url output matches input
        env:
          BUN_DOWNLOAD_URL: ${{ steps.setup-bun.outputs.bun-download-url }}
        run: |
          echo "bun-download-url: $BUN_DOWNLOAD_URL"
          EXPECTED="https://github.com/oven-sh/bun/releases/download/bun-v1.1.0/bun-linux-x64.zip"
          if [ "$BUN_DOWNLOAD_URL" != "$EXPECTED" ]; then
            echo "FAIL: expected download URL '$EXPECTED', got '$BUN_DOWNLOAD_URL'"
            exit 1
          fi
          echo "PASS: bun-download-url matches expected"

      - name: Assert bun-path output is set
        env:
          BUN_PATH: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          echo "bun-path: $BUN_PATH"
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun-path output is empty"
            exit 1
          fi
          if [ ! -f "$BUN_PATH" ]; then
            echo "FAIL: bun-path '$BUN_PATH' does not point to an existing file"
            exit 1
          fi
          echo "PASS: bun-path=$BUN_PATH"
