name: Test custom download URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-bun
        uses: .
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.1.0/bun-linux-x64.zip"
      - name: Assert bun is installed and on PATH
        run: |
          echo "which bun: $(which bun)"
          if ! command -v bun &>/dev/null; then
            echo "FAIL: bun not found on PATH"
            exit 1
          fi
          bun --version
          echo "PASS: bun is on PATH"
      - name: Assert bun-download-url output matches the provided URL
        env:
          BUN_DOWNLOAD_URL: ${{ steps.setup-bun.outputs.bun-download-url }}
        run: |
          echo "bun-download-url: $BUN_DOWNLOAD_URL"
          EXPECTED="https://github.com/oven-sh/bun/releases/download/bun-v1.1.0/bun-linux-x64.zip"
          if [ "$BUN_DOWNLOAD_URL" != "$EXPECTED" ]; then
            echo "FAIL: expected bun-download-url='$EXPECTED', got '$BUN_DOWNLOAD_URL'"
            exit 1
          fi
          echo "PASS: bun-download-url matches"
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
        run: |
          echo "bun-version: $BUN_VERSION"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS: bun-version=$BUN_VERSION"
