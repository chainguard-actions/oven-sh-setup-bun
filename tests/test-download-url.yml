name: Test bun-download-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip
      - name: Assert bun-path output is set
        env:
          BUN_PATH: ${{ steps.action.outputs.bun-path }}
        run: |
          echo "bun-path: $BUN_PATH"
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun-path output is empty"
            exit 1
          fi
          echo "PASS: bun-path is set to $BUN_PATH"
      - name: Assert bun is executable
        run: |
          if ! command -v bun > /dev/null 2>&1; then
            echo "FAIL: bun is not on PATH"
            exit 1
          fi
          echo "PASS: bun is available at $(command -v bun)"
          bun --version
