name: Test bun-download-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.1.0/bun-linux-x64.zip
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.action.outputs.bun-version }}
          BUN_PATH: ${{ steps.action.outputs.bun-path }}
          DOWNLOAD_URL: ${{ steps.action.outputs.bun-download-url }}
        run: |
          echo "bun-version: $BUN_VERSION"
          echo "bun-path: $BUN_PATH"
          echo "bun-download-url: $DOWNLOAD_URL"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun-path output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert bun is executable
        run: |
          bun --version
          echo "PASS: bun is on PATH and executable"
