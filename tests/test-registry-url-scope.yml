name: Test registry-url and scope inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bun-version: "latest"
          registry-url: "https://registry.npmjs.org/"
          scope: "@myorg"
      - name: Assert bun-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.bun-version }}
        run: |
          echo "actual bun-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert bun is on PATH
        run: |
          which bun
          bun --version
          echo "PASS"
