name: Test scope input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bun-version: latest
          registry-url: https://registry.npmjs.org/
          scope: "@myorg"
      - name: Assert bun-version output is set
        env:
          BUN_VERSION: ${{ steps.action.outputs.bun-version }}
          BUN_PATH: ${{ steps.action.outputs.bun-path }}
        run: |
          echo "bun-version: $BUN_VERSION"
          echo "bun-path: $BUN_PATH"
          if [ -z "$BUN_VERSION" ]; then
            echo "FAIL: bun-version output is empty"
            exit 1
          fi
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun-path output is empty"
            exit 1
          fi
          echo "PASS: bun installed with scope configured"
      - name: Assert bun is executable
        run: |
          if ! command -v bun &>/dev/null; then
            echo "FAIL: bun not found in PATH"
            exit 1
          fi
          bun --version
          echo "PASS: bun is executable"
