name: 🧪 Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-cache:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: 🗑️ Remove cache
        run: gh cache delete --all || true
        env:
          GH_TOKEN: ${{ github.token }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Setup Bun
        uses: ./
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test --coverage

  setup-bun:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    needs: [remove-cache, tests]

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - windows-11-arm
        bun-version:
          - latest
          - canary
          - "1.1.0"
          - "1.x"
          - "1"
          - "> 1.0.0"
          - "< 2"
          # https://github.com/oven-sh/setup-bun/issues/37
          # - "1.x"
          # - "1"
          # - "> 1.0.0"
          # - "< 2"
          # Disable <sha> support for now. This is because Github Artifacts
          # expire after 90 days, and we don't have another source of truth yet.
          # - "822a00c4d508b54f650933a73ca5f4a3af9a7983" # 1.0.0 commit

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: 🛠️ Setup Bun
        uses: ./
        id: setup_bun
        with:
          bun-version: ${{ matrix.bun-version }}
          no-cache: true

      - name: ▶️ Run Bun
        id: run_bun
        run: |
          bun --version

      - name: ⚖️ Verify Bun version
        uses: ./.github/actions/compare-bun-version
        with:
          bun-version: ${{ matrix.bun-version }}

  setup-bun-from-file:
    name: setup-bun from (${{ matrix.os }}, ${{ matrix.file.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    needs: [remove-cache, tests]
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - windows-11-arm

        file:
          - name: package.json (packageManager bun@1.1.0)
            file: package.json
            jq_filter: '. += {"packageManager": "bun@1.1.0"}'
            jq_target: package.json

          - name: foo/package.json (packageManager bun@1.1.0)
            file: foo/package.json
            mkdir_path: foo
            jq_filter: '. += {"packageManager": "bun@1.1.0"}'
            jq_target: foo/package.json

          - name: package.json (packageManager yarn@bun@1.1.0)
            file: package.json
            jq_filter: '. += {"packageManager": "yarn@bun@1.1.0"}'
            jq_target: package.json

          - name: package.json (engines bun@1.1.0)
            file: package.json
            jq_filter: '.engines = {"bun": "1.1.0"}'
            jq_target: package.json

          - name: .tool-versions (bun 1.1.0)
            file: .tool-versions
            file_content: "bun 1.1.0"
            file_path: .tool-versions

          - name: .tool-versions (bun1.1.0)
            file: .tool-versions
            file_content: "bun1.1.0"
            file_path: .tool-versions

          - name: .tool-versions (bun  1.1.0)
            file: .tool-versions
            file_content: "bun 1.1.0"
            file_path: .tool-versions

          - name: .bumrc (1.1.0)
            file: .bumrc
            file_content: "1.1.0"
            file_path: .bumrc

          - name: .bun-version (1.1.0)
            file: .bun-version
            file_content: "1.1.0"
            file_path: .bun-version

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: 📄 Setup file
        env:
          MKDIR_PATH: ${{ matrix.file.mkdir_path }}
          JQ_FILTER: ${{ matrix.file.jq_filter }}
          JQ_TARGET: ${{ matrix.file.jq_target }}
          FILE_CONTENT: ${{ matrix.file.file_content }}
          FILE_PATH: ${{ matrix.file.file_path }}
        run: |
          if [ -n "$MKDIR_PATH" ]; then
            mkdir -p "$MKDIR_PATH"
          fi
          if [ -n "$JQ_FILTER" ]; then
            tmp=$(mktemp)
            jq "$JQ_FILTER" "$JQ_TARGET" > "$tmp"
            mv "$tmp" "$JQ_TARGET"
          fi
          if [ -n "$FILE_PATH" ]; then
            printf '%s\n' "$FILE_CONTENT" > "$FILE_PATH"
          fi

      - name: 🛠️ Setup Bun
        uses: ./
        with:
          bun-version-file: ${{ matrix.file.file }}
          no-cache: true

      - name: ⚖️ Compare versions
        uses: ./.github/actions/compare-bun-version
        with:
          bun-version: "1.1.0"

  setup-bun-from-package-json-without-specified-field:
    name: setup-bun from (${{ matrix.os }}, ${{ matrix.file.name }}) without specified field
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    needs: [remove-cache, tests]
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - windows-11-arm

        file:
          - name: package.json (packageManager bun@1.1.0)
            file: package.json
            jq_filter: '. += {"packageManager": "bun@1.1.0"}'
            jq_target: package.json

          - name: package.json (packageManager yarn@bun@1.1.0)
            file: package.json
            jq_filter: '. += {"packageManager": "yarn@bun@1.1.0"}'
            jq_target: package.json

          - name: package.json (engines bun@1.1.0)
            file: package.json
            jq_filter: '.engines = {"bun": "1.1.0"}'
            jq_target: package.json

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: 📄 Setup file
        env:
          JQ_FILTER: ${{ matrix.file.jq_filter }}
          JQ_TARGET: ${{ matrix.file.jq_target }}
        run: |
          tmp=$(mktemp)
          jq "$JQ_FILTER" "$JQ_TARGET" > "$tmp"
          mv "$tmp" "$JQ_TARGET"

      - name: 🛠️ Setup Bun
        uses: ./
        with:
          no-cache: true

      - name: ⚖️ Compare versions
        uses: ./.github/actions/compare-bun-version
        with:
          bun-version: "1.1.0"

  setup-bun-download-url:
    name: setup-bun from (${{ matrix.os }}, download url)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    needs: [remove-cache, tests]

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: 🛠️ Setup Bun
        uses: ./
        id: setup_bun
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/latest/download/bun-${{runner.os == 'macOS' && 'darwin' || runner.os}}-${{ runner.arch == 'X64' && 'x64' || 'aarch64' }}.zip"

      - name: ▶️ Run Bun
        id: run_bun
        run: |
          bun --version

  test-custom-registries:
    name: test installing deps from custom registries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    needs: [remove-cache, tests]
    strategy:
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: 🛠️ Setup Bun
        uses: ./
        id: setup_bun
        with:
          registries: |
            https://registry.npmjs.org
            @types:https://registry.yarnpkg.com

      - name: ▶️ Install from default registry
        run: |
          output=$(bun add is-odd --verbose --force 2>&1)

          if echo "$output" | grep -q "HTTP/1.1 GET https://registry.npmjs.org/is-odd"; then
            echo "Successfully installed from default registry"
          else
            echo "Failed to install from default registry"
            exit 1
          fi

      - name: ▶️ Install from @types registry
        run: |
          output=$(bun add @types/bun --verbose --force 2>&1)

          if echo "$output" | grep -q "HTTP/1.1 GET https://registry.yarnpkg.com/@types%2fbun"; then
            echo "Successfully installed from @types registry"
          else
            echo "Failed to install from @types registry"
            exit 1
          fi
